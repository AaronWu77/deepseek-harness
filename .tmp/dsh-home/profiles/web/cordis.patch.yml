- id: pwsh-sandbox
  name: "@deepseek-ai/dsh-pwsh-sandbox"
  config:
    timeoutMs: 1200000000000000
    maxOutputBytes: 6400000000000000
- id: agent-loop
  name: "@deepseek-ai/dsh-agent-loop"
  config:
    agents: []
    maxParallelToolCalls: 5
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V41-Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
- id: llm-openai-codex
  name: dsh-codex-connect
  config:
    enableReserveFallback: false
    enableNativeCompaction: false
    models:
      - gpt-6-astra
      - gpt-6.1-sol
    enableProxy: true
    proxyUrl: http://127.0.0.1:7890
    modelCatalogClientVersion: 0.159.0
    enableSearch: true
    enableImageTool: true
    enableImageGeneration: false
    autoReviewDisclosureAcknowledged: true
    enableAutoReview: false
    searchModel: gpt-6.1-sol
    searchMode: live
    searchContextSize: medium
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxDepth: 1
    maxActiveSubagents: 2
- id: agent-preset-registry
