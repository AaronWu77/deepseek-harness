# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# compaction-basic: the shipped thresholdRatio is 0.8, compared against an
# ESTIMATED token count (the token meter assumes 4 characters per token), so
# CJK-heavy sessions are under-counted by roughly half and the automatic
# reduction fires late. 0.6 keeps it comfortably ahead of a real overflow.
# A patch entry REPLACES the row's complete config; this row ships none, so
# every other policy value keeps its schema default (retainRatio 0.16).
- id: compaction-basic
  config:
    thresholdRatio: 0.6
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: openai-codex-2
    model: gpt-6.1-sol
    reasoningEffort: high
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      quanxi:
        displayName: Quanxi
        apiKeyEnv: QUANXI_API_KEY
        api: openai-responses
        baseURL: http://192.168.40.103:8080/v1
        defaultInput:
          - text
          - image
        models:
          - id: gpt-6-astra
            name: GPT-6-Astra
            contextWindow: 256000
            maxTokens: 128000
            reasoningEfforts:
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-6.1-sol
            name: GPT-6.1-sol
            reasoningEfforts:
              high: high
              xhigh: xhigh
              max: max
            contextWindow: 500000
            maxTokens: 128000
        retryPolicy:
          mode: normal
          maxRetries: 5
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - PI_AI_ERROR
          backoff:
            initialDelayMs: 1000
            maxDelayMs: 30000
            jitterRatio: 0.2
      lingsuan:
        displayName: LingSuan
        apiKeyEnv: LINGSUAN_API_KEY
        api: openai-responses
        baseURL: https://lingsuan.org
        models:
          - id: gpt-6-astra
            name: GPT-6 Astra
            reasoningEfforts:
              high: high
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            reasoningEfforts:
              high: high
              xhigh: xhigh
              max: max
            input:
              - text
              - image
      quanxi1:
        displayName: OpenDesign
        apiKeyEnv: QUANXI1_API_KEY
        api: openai-completions
        baseURL: http://192.168.40.103:8080/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              max: max
          - id: mimo-v2.6-flash
            name: mimo-v2.6-flash
            contextWindow: 1048576
            input:
              - text
              - image
            reasoningEfforts:
              max: max
          - id: mimo-v2.6-pro
            name: mimo-v2.6-pro
            contextWindow: 1048576
            input:
              - text
              - image
            reasoningEfforts:
              max: max
      quanxi2:
        displayName: OpenCode
        apiKeyEnv: QUANXI2_API_KEY
        api: openai-responses
        baseURL: http://192.168.40.103:8080/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 1000000
            reasoningEfforts:
              max: max
            input:
              - text
              - image
          - id: grok-4.7
            name: grok-4.7
            contextWindow: 500000
            reasoningEfforts:
              max: max
            input:
              - text
              - image
          - id: kimi-k3
            name: kimi-k3
            contextWindow: 1048576
            reasoningEfforts:
              max: max
            input:
              - text
              - image
          - id: mimo-v2.6-flash
            name: mimo-v2.6-flash
            contextWindow: 1048576
            reasoningEfforts:
              max: max
            input:
              - text
              - image
          - id: mimo-v2.6-pro
            name: mimo-v2.6-pro
            contextWindow: 1048576
            reasoningEfforts:
              max: max
            input:
              - text
              - image
          - id: muse-spark-1.3-contributor
            name: muse-spark-1.3-contributor
            contextWindow: 1048576
