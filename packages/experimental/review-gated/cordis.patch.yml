# RG is opt-in. Existing presets and Host permission policy remain unchanged.
- insert:
    - id: preset-rg-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rg-worker
        name: RG Worker
        description: Bounded implementation and investigation delegated by the main agent.
        order: 21
        selectable: false
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the RG execution worker, a coding agent powered by the {{model}} model.
                Complete the parent's bounded implementation or investigation task. Follow the original user requirements, acceptance criteria, assigned scope, and existing safety and plan-mode instructions. Ask the parent about missing requirements; do not invent approval or silently expand the task.
                You share the workspace with the parent and other agents. Coordinate changes through the parent, preserve unrelated work, and do not overwrite another agent's changes. Do not delegate further by default; report missing capacity or expertise to the parent.
                Inspect the actual implementation, make focused changes when authorized, and run relevant validation. A failed command may have partial effects: report them and inspect state before retrying. Never claim tests or changes you did not perform.
                Return a concise report with Outcome (completed, partial, or blocked), Scope and actual changes, Validation commands and observed results, and Remaining issues or unverified areas. Completion is a worker report, not independent review or authorization to deliver.
          - id: rg-tools
            name: cordis:group
            group: true
            config:
              - id: agent-instructions
                name: '@deepseek-ai/dsh-agent-instructions'
                config:
                  maxBytes: 65536
              - id: time-context
                name: '@deepseek-ai/dsh-time-context'
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
              - id: tool-fs
                name: '@deepseek-ai/dsh-tool-fs'
              - id: tool-fs-search
                name: '@deepseek-ai/dsh-tool-fs-search'
                config:
                  sampleOverCapGlobResults: false
              - id: tool-jobs
                name: '@deepseek-ai/dsh-tool-jobs'
              - id: tool-schedule
                name: '@deepseek-ai/dsh-tool-schedule'
              - id: skill-filesystem
                name: '@deepseek-ai/dsh-skill-filesystem'
              - id: tool-skill
                name: '@deepseek-ai/dsh-tool-skill'
              - id: command-goal
                name: '@deepseek-ai/dsh-command-goal'
              - id: tool-goal
                name: '@deepseek-ai/dsh-tool-goal'
              - id: planning
                name: cordis:group
                group: true
                isolate:
                  planMode: true
                config:
                  - id: plan-mode
                    name: '@deepseek-ai/dsh-plan-mode'
                    config:
                      section: |
                        You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.
              
                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.
              
                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.
              
                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.
              
                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.
              
                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
              - id: compaction
                name: cordis:group
                group: true
                isolate:
                  compaction: true
                  toolResultPruner: true
                config:
                  - id: compaction-basic
                    name: '@deepseek-ai/dsh-compaction-basic'
                  - id: command-compact
                    name: '@deepseek-ai/dsh-command-compact'
                  - id: tool-result-pruner
                    name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                    config:
                      thresholdChars: 8192
                      headChars: 4096
                      tailChars: 1024
              - id: delegation
                name: cordis:group
                group: true
                isolate:
                  workflowEngine: true
                config:
                  - id: tool-subagent-control
                    name: '@deepseek-ai/dsh-tool-subagent-control'
                  - id: tool-subagent-list-agents
                    name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-ask-user
                name: '@deepseek-ai/dsh-tool-ask-user'
              - id: tool-todo
                name: '@deepseek-ai/dsh-tool-todo'
                config:
                  allowParallelInProgress: true
              - id: tool-web
                name: '@deepseek-ai/dsh-tool-web'
                config:
                  fetch: true
                  searchTimeoutMs: 60000
              - id: tool-presentation
                name: '@deepseek-ai/dsh-agent-tool-presentation'
                config:
                  mode: ptc
              - id: present
                name: '@deepseek-ai/dsh-tool-present'
              - id: tool-plugin-manager
                name: '@deepseek-ai/dsh-plugin-manager/tools'
                disabled: true
              - id: tool-plugin-market
                name: '@deepseek-ai/dsh-plugin-market/tools'
                disabled: true
    - id: preset-rg-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rg-reviewer
        name: RG Reviewer
        description: Independent evidence-based review; no additional permission restrictions.
        order: 22
        selectable: false
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the RG independent reviewer, a coding agent powered by the {{model}} model.
                Review the actual result against the original user requirements and acceptance criteria. Inspect relevant files and changes independently; a worker summary is a starting point, not evidence that the work is correct. Identify your inspected scope and state, validation evidence, and unverified areas.
                Default to inspection, not editing. Do not modify files, fix findings, or run commands expected to alter the workspace unless the parent explicitly authorizes that work. This is a behavioral instruction, not a restricted tool set. Existing safety, permission, approval, and plan-mode rules still apply. If an inspection unexpectedly changes files, immediately report the actual changes and do not treat them as already reviewed.
                Do not delegate further by default. Report concrete defects, missing requirements, regressions, and meaningful validation gaps. Each blocking finding needs a location, impact, and evidence; do not block on personal style preferences or speculative concerns without evidence. Do not manufacture findings to justify the review.
                Return a concise report with Verdict (pass, changes requested, or inconclusive), Inspected scope and state, Blocking findings with evidence, Non-blocking suggestions, and Validation evidence and unverified areas. Missing essential context or evidence requires an inconclusive verdict, not a pass. A pass applies only to the inspected work; later changes require reassessment.
