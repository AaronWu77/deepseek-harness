- id: session
  name: '@deepseek-ai/dsh-session'
- id: projections
  name: '@deepseek-ai/dsh-session-projection'
- id: llm
  name: '@deepseek-ai/dsh-llm'
- id: prompt
  name: '@deepseek-ai/dsh-system-prompt'
- id: tools
  name: '@deepseek-ai/dsh-tools'
- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: '{{root}}'
- id: directory
  name: '@deepseek-ai/dsh-working-directory'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: agents
  name: '@deepseek-ai/dsh-agent'
- id: loop
  name: '@deepseek-ai/dsh-agent-loop'
- id: deployment-runtime
  name: './scripted-runtime.ts'
  config:
    label: deployment
    language: python
    defaultMs: 41000
    maxMs: 42000
- id: presets
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: native
- id: native-preset
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: native
    plugins:
      - id: presentation
        name: '@deepseek-ai/dsh-agent-tool-presentation'
        config:
          mode: native
- id: deployment-preset
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: deployment
    plugins:
      - id: presentation
        name: '@deepseek-ai/dsh-agent-tool-presentation'
        config:
          mode: ptc
- id: scoped-preset
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: scoped
    plugins:
      - id: realm
        name: cordis:group
        group: true
        isolate:
          ptcRuntime: true
        config:
          - id: runtime
            name: './scripted-runtime.ts'
            config:
              label: scoped-v1
              language: typescript
              defaultMs: 11000
              maxMs: 12000
          - id: presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: '{{mode}}'
